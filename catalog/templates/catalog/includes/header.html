<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 me-4 font-weight-normal">
        <a href="{% url 'catalog:home' %}" class="text-dark text-decoration-none">
            🏪 SkyStore
        </a>
    </h5>
    <nav class="ms-auto d-flex flex-wrap gap-2">
        <a class="btn btn-outline-primary" href="{% url 'catalog:home' %}">
            📱 Каталог
        </a>
        <a class="btn btn-outline-primary" href="{% url 'blog:blog_list' %}">
            📝 Блог
        </a>
        <a class="btn btn-outline-primary" href="{% url 'catalog:contacts' %}">
            📞 Контакты
        </a>
    </nav>

    <!-- Блок аутентификации -->
    <div class="ms-3">
        {% if user.is_authenticated %}
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    👤 {{ user.first_name|default:user.email }}
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="{% url 'users:profile' %}">👤 Профиль</a></li>
                    <li><a class="dropdown-item" href="{% url 'catalog:product_create' %}">➕ Добавить товар</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="{% url 'users:logout' %}">🚪 Выйти</a></li>
                </ul>
            </div>
        {% else %}
            <a href="{% url 'users:login' %}" class="btn btn-outline-success me-1">🔐 Войти</a>
            <a href="{% url 'users:register' %}" class="btn btn-success">📝 Регистрация</a>
        {% endif %}
    </div>
</div>
